[project]
name = "devatlas-backend"
version = "0.1.0"
description = "Technical-book research assistant and reproducible RAG experiments."
requires-python = ">=3.14"
dependencies = [
    "braintrust>=0.49.2",
    "fastapi>=0.162.0",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "openai>=3.46.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "agent", "rag", "evals"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
